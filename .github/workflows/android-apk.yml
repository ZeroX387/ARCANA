name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3 and Android export templates
        run: |
          GODOT_VERSION="4.3"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-export-templates
          cp -R /tmp/godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add ARCANA_KEYSTORE_BASE64 and the other ARCANA signing secrets before building."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcana-release.keystore"
          test -s "$RUNNER_TEMP/arcana-release.keystore"

      - name: Import Godot project
        run: godot --headless --editor --path game --quit

      - name: Export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/arcana-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ARCANA_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ARCANA_KEY_PASSWORD }}
        run: |
          mkdir -p game/builds
          godot --headless --path game --export-release "Android" builds/ARCANA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCANA-Android-APK
          path: game/builds/ARCANA.apk
          if-no-files-found: error
          retention-days: 30
