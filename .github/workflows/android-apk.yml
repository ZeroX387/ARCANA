name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

      - name: Install Godot 4.3 and Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 0755 /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-export-templates
          cp -R /tmp/godot-export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ARCANA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add ARCANA_KEYSTORE_BASE64 and the other ARCANA signing secrets before building."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcana-release.keystore"
          test -s "$RUNNER_TEMP/arcana-release.keystore"

      - name: Validate signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ARCANA_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/arcana-release.keystore" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::ARCANA_KEYSTORE_PASSWORD does not unlock the uploaded PKCS12 keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/arcana-release.keystore" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::ARCANA_KEY_ALIAS does not match an entry in the uploaded keystore."
            exit 1
          fi
          echo "Signing keystore password and alias verified."

      - name: Import Godot project
        run: godot --headless --editor --path game --quit --verbose

      - name: Export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/arcana-release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ARCANA_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ARCANA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p game/builds
          godot --headless --verbose --path game --export-release "Android" builds/ARCANA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ARCANA-Android-APK
          path: game/builds/ARCANA.apk
          if-no-files-found: error
          retention-days: 30
